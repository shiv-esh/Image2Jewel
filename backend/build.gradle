plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
}

group = 'com.jewel'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '25'
}

repositories {
    mavenCentral()
}

ext {
    set('djlVersion', '0.27.0')
    // Reverting to the universally stable 0.x series to guarantee resolution
    set('langchain4jVersion', '0.36.2')
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.6')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    implementation "ai.djl:api:${djlVersion}"
    implementation "ai.djl.pytorch:pytorch-engine:${djlVersion}"
    implementation "ai.djl.pytorch:pytorch-model-zoo:${djlVersion}"

    // LLM: LangChain4j explicitly using 0.36.2
    implementation "dev.langchain4j:langchain4j-core:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-open-ai:${langchain4jVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
