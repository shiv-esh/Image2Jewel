server {
    listen 80;
    server_name catharsis-wellness.duckdns.org;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Certbot challenge (keep this for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name catharsis-wellness.duckdns.org;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/catharsis-wellness.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catharsis-wellness.duckdns.org/privkey.pem;

    # Best practices for SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Internal Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # Frontend Static Files (Fallback/Direct access)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serving Catalogue Images
    location /assets/catalogue/ {
        alias /app/catalogue/images/;
    }
}
