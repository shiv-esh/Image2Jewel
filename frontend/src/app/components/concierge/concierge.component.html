<div class="concierge-container">
  <header>
    <h1 class="gold-text">Image2Jewel Concierge</h1>
    <p>Upload a piece of jewelry to find matches or ask for a pairing.</p>
  </header>

  <main>
    <div class="upload-section glass-card">
      <div class="drop-zone" (click)="fileInput.click()" (drop)="onDrop($event)" (dragover)="onDragOver($event)">
        <input type="file" #fileInput (change)="onFileSelected($event)" hidden accept="image/*">
        <div *ngIf="!selectedImage" class="prompt">
          <i class="icon-upload"></i>
          <p>Drop an image here or click to browse</p>
        </div>
        <img *ngIf="selectedImage" [src]="selectedImage" class="preview">
      </div>

      <div class="chat-overlay" style="display: flex; gap: 10px;">
        <select [(ngModel)]="selectedCategory" class="glass-card" style="padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 215, 0, 0.3); background: rgba(0, 0, 0, 0.6); color: white; flex: 1; outline: none; font-family: inherit;">
          <option *ngFor="let cat of categories" [value]="cat" style="background: #111; color: white;">
            {{ cat === 'Similar' ? 'Find Similar Items' : 'Find similar ' + cat }}
          </option>
        </select>
        <button class="btn-primary" (click)="search()">Discover</button>
      </div>
    </div>

    <div class="results-section" *ngIf="results.length > 0">
      <h2 class="gold-text">Curated Recommendations</h2>
      <div class="masonry-grid">
        <div class="jewelry-item glass-card" *ngFor="let item of results">
          <img [src]="apiUrl + item.imageUrl" [alt]="item.name">
          <div class="details">
            <h3>{{item.name}}</h3>
            <p>{{item.category}}</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
